<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="基于 serviceWorker 和 File System Access API 的本地离线 Markdown 笔记本" />
  <meta name="theme-color" content="#1565c0" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <title>Markdown笔记本</title>
  <link rel="stylesheet" href="bytemd.css" />
  <link rel="stylesheet" href="markdown.css" />
  <link rel="stylesheet" href="highlight.css" />
  <style>
    html,
    body {
      margin: 0;
      height: 100%;
    }

    /* 整体布局：左侧文件列表 + 右侧编辑器 */
    #app {
      display: flex;
      height: 100vh;
    }

    #sidebar {
      width: 220px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #e0e0e0;
      background: #fafafa;
      overflow: hidden;
    }

    #sidebar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 600;
      color: #555;
      border-bottom: 1px solid #eee;
    }

    #new-file {
      border: none;
      background: none;
      font-size: 18px;
      line-height: 1;
      color: #555;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 4px;
    }

    #new-file:hover {
      background: #eee;
      color: #000;
    }

    #file-list {
      list-style: none;
      margin: 0;
      padding: 4px 0;
      overflow-y: auto;
      flex: 1;
    }

    #file-list li {
      padding: 6px 12px;
      font-size: 13px;
      color: #333;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #file-list li:hover {
      background: #eee;
    }

    #file-list li.active {
      background: #e3f2fd;
      color: #1565c0;
    }

    #editor {
      flex: 1;
      min-width: 0;
    }

    #editor .bytemd {
      height: 100%;
    }

    /* 未选目录时的操作按钮 */
    #pick,
    #perm {
      position: fixed;
      top: 12px;
      z-index: 10;
      display: none;
    }

    #perm {
      left: 12px;
    }

    #pick {
      left: 130px;
    }
  </style>
</head>

<body>
  <button id="pick" onclick="pickDir()">选择存储文件夹</button>
  <button id="perm" onclick="reqPerm()">获取访问权限</button>
  <div id="app">
    <aside id="sidebar">
      <div id="sidebar-header">
        <span>文档</span>
        <button id="new-file" title="新建文档">＋</button>
      </div>
      <ul id="file-list"></ul>
    </aside>
    <div id="editor"></div>
  </div>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js')
        .then(function(reg) {
          // registration worked
          console.log('Registration succeeded. Scope is ' + reg.scope)
        })
        .catch(function(error) {
          // registration failed
          console.log('Registration failed with ' + error)
        })

      navigator.serviceWorker.addEventListener('controllerchange', () => {
        alert('Service Worker 控制权已更改，请刷新页面以使用最新的功能。');
      });
    }
  </script>
  <script src="plugin-gfm.js"></script>
  <script src="plugin-highlight.js"></script>
  <script src="bytemd-plugin.js"></script>
  <script src="bytemd-paste.js"></script>
  <script type="module" src="index.js"></script>
</body>

</html>
